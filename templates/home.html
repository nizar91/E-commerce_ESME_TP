<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accueil</title>
</head>
<body>
    <h1>Bienvenue {{ username }}</h1>
    <p>Choisissez un article a commander :</p>
    <ul>
        {% for article in articles %}
            <li>
                {{ article.name }}
                <form action="{{ url_for('buy', article_id=article.id) }}" method="post" style="display:inline;">
                    <button type="submit">Acheter</button>
                </form>
            </li>
        {% endfor %}
    </ul>

    <p>
        <a href="{{ url_for('view_purchases') }}">Voir mes commandes</a> |
        <a href="{{ url_for('logout') }}">Se deconnecter</a>
    </p>
</body>
</html>
