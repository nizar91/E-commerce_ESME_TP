version: '3.8'

services:
# --- Service Authentification ---
  auth:
    build: ./auth
    # ... autres configurations ...
    healthcheck:
      # 🚨 CORRECTION : Utiliser la route GET /health
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 5s
      timeout: 10s
      retries: 5

  # --- Service Commandes  ---
  orders:
    build: ./orders
    container_name: orders_service
    ports:
      - "5001:5001"
    volumes:
      - ./orders/data:/app/data
    depends_on:
      auth:
        condition: service_healthy # Attendre que l'Auth Service soit prêt

  # --- API Gateway ---
  gateway:
    build: ./gateway
    container_name: gateway_service
    ports:
      - "5003:5003"
    depends_on:
      auth:
        condition: service_healthy # Attendre l'Auth
      orders:
        condition: service_started
  
  # --- Front-end (Monolithe UI) ---
  front:
    build: ./front
    container_name: front_service
    ports:
      - "5000:5000"
    depends_on:
      gateway:
        condition: service_started
      auth:
        condition: service_healthy # Le front doit attendre l'Auth pour les appels de login!