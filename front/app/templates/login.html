<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique ESME | Authentification</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#05060b;
            --card:#11121b;
            --muted:#a0a3b1;
            --text:#f7f7fb;
            --accent:#ff6f61;
            --accent-soft:#fcb7af;
            --border:rgba(255,255,255,0.08);
        }
        *{box-sizing:border-box;}
        body{
            margin:0;
            font-family:'Outfit',sans-serif;
            min-height:100vh;
            background:radial-gradient(circle at top,#1c2133 0%, var(--bg) 70%);
            color:var(--text);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px 16px;
            position:relative;
            overflow:hidden;
        }
        .orb{
            position:absolute;
            border-radius:50%;
            filter:blur(1px);
            opacity:0.4;
        }
        .orb-one{
            width:420px;height:420px;
            background:radial-gradient(circle,#ff9f90,transparent 70%);
            top:-120px;right:-120px;
        }
        .orb-two{
            width:320px;height:320px;
            background:radial-gradient(circle,#7cc0ff,transparent 70%);
            bottom:-100px;left:-60px;
        }
        .login-shell{
            width:100%;
            max-width:540px;
            background:var(--card);
            border-radius:28px;
            border:1px solid var(--border);
            padding:48px;
            position:relative;
            box-shadow:0 50px 120px rgba(0,0,0,0.55);
            backdrop-filter:blur(5px);
        }
        .brand-panel{
            display:flex;
            gap:18px;
            align-items:center;
            margin-bottom:24px;
        }
        .brand-badge{
            width:58px;height:58px;
            border-radius:16px;
            border:1px solid var(--border);
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:600;
        }
        .brand-panel h1{
            margin:0;
            font-size:1.9rem;
        }
        .brand-panel p{
            margin:4px 0 0 0;
            color:var(--muted);
        }
        .tagline{
            background:rgba(255,255,255,0.02);
            border:1px solid var(--border);
            border-radius:18px;
            padding:18px 20px;
            margin-bottom:28px;
            color:var(--muted);
            font-size:0.95rem;
        }
        form{
            display:flex;
            flex-direction:column;
            gap:18px;
        }
        label{
            font-size:0.85rem;
            color:var(--muted);
        }
        input{
            width:100%;
            padding:12px 14px;
            border-radius:12px;
            border:1px solid var(--border);
            background:rgba(255,255,255,0.02);
            color:var(--text);
            font-size:1rem;
        }
        input:focus{
            outline:none;
            border-color:var(--accent-soft);
            box-shadow:0 0 0 3px rgba(252,183,175,0.15);
        }
        .error-box{
            background:rgba(255,110,110,0.12);
            border:1px solid rgba(255,110,110,0.4);
            color:#ff9b9f;
            padding:12px 16px;
            border-radius:14px;
            font-size:0.9rem;
        }
        .actions{
            display:flex;
            flex-direction:column;
            gap:12px;
            margin-top:8px;
        }
        button{
            border:none;
            border-radius:14px;
            font-weight:600;
            padding:14px;
            cursor:pointer;
            transition:transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-primary{
            background:linear-gradient(120deg,#ff9f90,#ff6f61);
            color:#0a0b0f;
            box-shadow:0 15px 40px rgba(255,111,97,0.35);
        }
        .btn-primary:hover{ transform:translateY(-2px); }
        .btn-ghost{
            background:transparent;
            border:1px solid var(--border);
            color:var(--text);
        }
        .btn-ghost:hover{ border-color:var(--accent); }
        @media (max-width:640px){
            .login-shell{padding:32px;}
        }
    </style>
</head>
<body>
    <span class="orb orb-one"></span>
    <span class="orb orb-two"></span>
    <section class="login-shell">
        <div class="brand-panel">
            <div class="brand-badge">ES</div>
            <div>
                <h1>Boutique ESME</h1>
                <p>Accédez à votre espace personnel</p>
            </div>
        </div>
        <div class="tagline">
            Capsule campus, silhouettes épurées et pièces pensées pour les journées projet comme pour les soirées associatives.
        </div>
        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div>
                <label for="user">Nom d'utilisateur</label>
                <input type="text" id="user" name="user" required placeholder="emma.laurent">
            </div>
            <div>
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <input type="hidden" name="action" id="action_login" value="login">
            <div class="actions">
                <button type="submit" class="btn-primary">Entrer dans l'atelier</button>
                <button type="submit" class="btn-ghost" onclick="document.getElementById('action_login').value='register';">
                    Créer un compte
                </button>
            </div>
        </form>
    </section>
</body>
</html>
