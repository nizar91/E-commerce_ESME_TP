---
- name: Ensure orders data directory exists
  ansible.builtin.file:
    path: "{{ compose_project_dir }}/orders/data"
    state: directory
    mode: "0755"

- name: Generate Docker Compose environment file
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ compose_project_dir }}/.env"
    mode: "0600"
